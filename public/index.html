<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Management Tool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="logo">⚡ TaskFlow</div>
    <div class="user-auth">
      <label for="currentUser">Log in as: </label>
      <select id="currentUser">
        <!-- Users loaded dynamically -->
      </select>
    </div>
  </header>

  <div class="main-container">
    <!-- Sidebar for Projects -->
    <aside class="sidebar">
      <h3>Projects</h3>
      <ul id="projectList"></ul>
      <div class="add-project-box">
        <input type="text" id="newProjectInput" placeholder="New project name...">
        <button id="addProjectBtn">+ Create Project</button>
      </div>
    </aside>

    <!-- Main Workspace for Board -->
    <main class="board">
      <div class="board-header">
        <h2 id="activeProjectTitle">Select a Project</h2>
        <button id="openTaskModalBtn" class="primary-btn" style="display:none;">+ Add Task</button>
      </div>

      <div class="tasks-container" id="tasksContainer">
        <p class="placeholder-text">Please select or create a project from the left menu.</p>
      </div>
    </main>
  </div>

  <!-- Modal for Creating Task -->
  <div id="taskModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <h3>Create New Task</h3>
      <form id="createTaskForm">
        <input type="text" id="taskTitle" placeholder="Task Title" required>
        <textarea id="taskDesc" placeholder="Task Description"></textarea>
        
        <label>Assign To:</label>
        <select id="taskAssignee"></select>

        <label>Status:</label>
        <select id="taskStatus">
          <option value="To Do">To Do</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>

        <button type="submit" class="primary-btn">Create Task</button>
      </form>
    </div>
  </div>

  <!-- Socket.io Library -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
